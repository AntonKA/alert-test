<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181f">
<title>Alert test staff</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Alert test: staff</h1>
  <h2>1. Customer link</h2>
  <div id="link" class="link"></div>
  <button id="copy" type="button">Copy link</button>
  <h2>2. Phones that joined</h2>
  <ul id="devices"></ul>
  <h2>3. Situation</h2>
  <div id="situations"></div>
  <p><button id="ready" type="button" class="primary">Ready</button></p>
  <p id="countdown"></p>
  <p id="status" role="status" aria-live="polite"></p>
  <h2>Results</h2>
  <div class="scroll"><table id="grid"></table></div>
  <h2>Log</h2>
  <p><button id="export" type="button">Export CSV</button></p>
  <div class="scroll"><table id="log"></table></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="staff.js"></script>
</body>
</html>
